[project]
name = "rag_project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "qingyu", email = "yoyo8720269@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "langchain>=1.4.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "litellm>=1.100.0",
    "pyinstaller>=6.22.2",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[project.scripts]
backend = "rag_project.main:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
